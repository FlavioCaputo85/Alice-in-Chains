<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Quiz DIRT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth">
        <div class="auth_caixa">
            <div class="auth_painel">
                <h1>Alice in Chains<br>DIRT Quiz</h1>
                <p>Entre para testar o quanto você conhece a banda de Seattle e veja seu placar no dashboard.</p>
            </div>
            <div class="auth_form">
                <h2>Entrar</h2>
                <div class="campo">
                    <label>E-MAIL</label>
                    <input id="input_email" type="text" placeholder="seu@email.com">
                </div>
                <div class="campo">
                    <label>SENHA</label>
                    <input id="input_senha" type="password" placeholder="******">
                </div>
                <div id="div_mensagem" class="mensagem"></div>
                <button class="botao" onclick="entrar()">ENTRAR</button>
                <p class="link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
