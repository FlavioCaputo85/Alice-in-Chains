<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice in Chains | Cadastro</title>
    <link rel="icon" href="assets/icon/logo.png">
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/validacao.js"></script>
</head>

<body>
    <script src="js/tema.js"></script>

    <div class="header">
        <div class="container">
            <h1 class="titulo">Alice in Chains</h1>
            <ul class="navbar">
                <li><a href="index.html">Início</a></li>
                <li><a href="dashboard/quiz.html">Quiz</a></li>
                <li><a href="login.html">Login</a></li>
                <li class="agora"><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </div>
    </div>

    <div class="centro">
        <div class="card">
            <h2>Bem-vindo!</h2>
            <div class="campo">
                <span>Nome:</span>
                <input id="nome_input" type="text" placeholder="Seu nome">
            </div>
            <div class="campo">
                <span>E-mail:</span>
                <input id="email_input" type="text" placeholder="meuemail@provedor.com" onkeyup="mostrarMsgEmail()">
                <div id="div_msg_email" class="regras"></div>
            </div>
            <div class="campo">
                <span>Senha:</span>
                <input id="senha_input" type="password" placeholder="******" onkeyup="mostrarRegrasSenha()">
                <div id="div_regras_senha" class="regras"></div>
            </div>
            <div class="campo">
                <span>Confirmação da senha:</span>
                <input id="confirmacao_input" type="password" placeholder="******">
            </div>
            <div id="mensagem_erro" class="mensagem"></div>
            <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
    </div>

    <div class="footer">
        <h4>Feito com amor por Flávio &hearts; SPTech &copy; 2026</h4>
    </div>

    <script src="js/cadastro.js"></script>
</body>

</html>
