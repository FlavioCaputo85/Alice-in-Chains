<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alice in Chains | Dashboard</title>
    <link rel="icon" href="../assets/icon/logo.png">
    <link rel="stylesheet" href="../css/estilo.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sessao.js"></script>
</head>

<body>
    <script src="../js/tema.js"></script>

    <div class="header">
        <div class="container">
            <h1 class="titulo">Alice in Chains</h1>
            <ul class="navbar">
                <li><a href="../index.html">Início</a></li>
                <li><a href="../toca-discos.html">Toca-discos</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li class="agora"><a href="dashboard.html">Dashboard</a></li>
                <li><a href="carteirinha.html">Carteirinha</a></li>
                <li>Olá, <b id="b_usuario"></b></li>
                <li><a href="#" onclick="limparSessao()">Sair</a></li>
            </ul>
        </div>
    </div>

    <div class="pagina">
        <h2>Seu desempenho</h2>
        <p id="div_aviso"></p>

        <div class="kpis">
            <div class="kpi">
                <span>Pontuação total</span>
                <strong id="kpi_pontos">-</strong>
                <small id="kpi_pontos_variacao"></small>
            </div>
            <div class="kpi">
                <span>Colocação no ranking</span>
                <strong id="kpi_posicao">-</strong>
                <small id="kpi_posicao_variacao"></small>
            </div>
            <div class="kpi">
                <span>Acertos na última partida</span>
                <strong id="kpi_acertos">-</strong>
                <small id="kpi_acertos_variacao"></small>
            </div>
        </div>

        <div class="graficos">
            <div class="grafico"><canvas id="grafico_evolucao"></canvas></div>
            <div class="grafico"><canvas id="grafico_albuns"></canvas></div>
        </div>

        <div class="graficos">
            <div class="grafico"><canvas id="grafico_ranking"></canvas></div>
            <div class="grafico lista">
                <h3>Perguntas que mais derrubam os jogadores</h3>
                <div id="div_dificeis"></div>
            </div>
        </div>

        <div class="acoes">
            <a class="botao" href="quiz.html">Jogar de novo</a>
            <a class="botao vazio" href="../index.html">Voltar ao início</a>
        </div>
    </div>

    <script src="../js/dashboard.js"></script>
</body>

</html>
